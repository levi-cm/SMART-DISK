name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install shell tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq shellcheck

      - name: Static checks
        run: |
          shellcheck scripts/*.sh tests/*.sh tests/smoke/*.sh
          # One file per bash -n: given several, it checks only the first.
          for f in scripts/*.sh tests/*.sh tests/smoke/*.sh; do bash -n "$f" || exit 1; done
          find tests/fixtures -type f -name '*.json' ! -name malformed.json -print0 | xargs -0 -n1 jq -e . >/dev/null
          jq -n -f scripts/parse_updates.jq >/dev/null

      - name: Tests
        run: |
          for t in tests/*_test.sh; do
            [[ "$t" == tests/container_smoke_test.sh ]] && continue
            echo "== $t"
            bash "$t"
          done

      - name: Container smoke test (offline)
        run: bash tests/container_smoke_test.sh

      - name: Compose render
        run: |
          cp .env.example .env
          docker compose config --quiet
